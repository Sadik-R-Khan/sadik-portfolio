    <!-- Pre-hydration theme initialization & scroll-to-top on reload -->
    <script>
      (function() {
        // Prevent browser from restoring scrolled down position on refresh
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        // Clear hash on fresh reload so browser doesn't automatically jump to contact
        if (window.location.hash && window.location.hash !== '#home') {
          history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }
        window.scrollTo(0, 0);

        // Pre-hydration theme setup: default strictly to 'light' unless user chose 'dark'
        try {
          var saved = localStorage.getItem('portfolio_theme') || localStorage.getItem('portfolio_user_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#090D16] text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white font-sans min-h-screen transition-colors duration-200">

  </body>
